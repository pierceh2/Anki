name: Update question bank counts

on:
  schedule:
    # 00:45/01:45 UTC covers the 8:45pm Eastern run; 16:00/17:00 UTC covers noon.
    - cron: "45 0,1 * * *"
    - cron: "0 16,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: question-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch question counts
        env:
          MKSAP_USERNAME: ${{ secrets.MKSAP_USERNAME }}
          MKSAP_PASSWORD: ${{ secrets.MKSAP_PASSWORD }}
          AMBOSS_EMAIL: ${{ secrets.AMBOSS_EMAIL }}
          AMBOSS_PASSWORD: ${{ secrets.AMBOSS_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python question_counts.py --scheduled
          else
            python question_counts.py
          fi

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain question_counts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add question_counts.json
            git commit -m "Update question counts"
            git push
          fi